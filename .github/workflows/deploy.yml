name: Build, Test & Deploy via SFTP

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  # Cancel superseded PR runs. Never cancel a deploy mid mirror.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build dist/ & Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build production dist/ payload
        run: npm run build

      - name: Run PHP & E2E verification suite
        run: npm test

      - name: Upload compiled dist/ artifact
        uses: actions/upload-artifact@v4
        with:
          name: placeholger-dist
          path: dist/
          include-hidden-files: true
          retention-days: 7

  deploy-sftp:
    name: Deploy dist/ via SFTP
    needs: build-and-test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Download compiled dist/ artifact
        uses: actions/download-artifact@v4
        with:
          name: placeholger-dist
          path: dist/

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Mirror ./dist/ to the server over SFTP using lftp. Uploads changed files first,
      # then deletes remote files that are no longer in ./dist/.
      # Server-only paths (.htpasswd, ACME challenges) are excluded and never touched.
      - name: Deploy to server
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST || vars.SFTP_HOST || secrets.FTP_SERVER }}
          SFTP_PORT: ${{ secrets.SFTP_PORT || vars.SFTP_PORT || secrets.FTP_PORT || '22' }}
          SFTP_USER: ${{ secrets.SFTP_USER || vars.SFTP_USER || secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD || secrets.FTP_PASSWORD }}
          SFTP_REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR || vars.SFTP_REMOTE_DIR || '/' }}
        run: |
          if [ -z "$SFTP_HOST" ] || [ -z "$SFTP_USER" ] || [ -z "$LFTP_PASSWORD" ]; then
            echo "❌ Error: SFTP_HOST, SFTP_USER, or SFTP_PASSWORD is empty. Set them in GitHub Repository Secrets."
            exit 1
          fi

          MIRROR="mirror --reverse --delete --parallel=4 --verbose"
          MIRROR="$MIRROR --exclude-glob .htpasswd --exclude ^\.well-known/acme-challenge/"
          lftp --env-password -u "$SFTP_USER" -p "$SFTP_PORT" \
            -e "set sftp:auto-confirm yes; set net:max-retries 3; $MIRROR ./dist/ $SFTP_REMOTE_DIR; bye" \
            "sftp://$SFTP_HOST"
