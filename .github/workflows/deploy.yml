name: Build, Test & Deploy via SFTP

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build dist/ & Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build production dist/ payload
        run: npm run build

      - name: Run PHP & E2E verification suite
        run: npm test

      - name: Upload compiled dist/ artifact
        uses: actions/upload-artifact@v4
        with:
          name: placeholger-dist
          path: dist/
          include-hidden-files: true
          retention-days: 7

  deploy-sftp:
    name: Deploy dist/ via SFTP
    needs: build-and-test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Download compiled dist/ artifact
        uses: actions/download-artifact@v4
        with:
          name: placeholger-dist
          path: dist/

      - name: Install OpenSSH & sshpass
        run: sudo apt-get update && sudo apt-get install -y openssh-client sshpass

      - name: Upload ./dist/ via pure SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST || vars.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT || vars.SFTP_PORT || '22' }}
          SFTP_USER: ${{ secrets.SFTP_USER || vars.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_SSH_KEY: ${{ secrets.SFTP_SSH_KEY }}
          SFTP_REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR || vars.SFTP_REMOTE_DIR || '.' }}
        run: |
          if [ -z "$SFTP_HOST" ] || [ -z "$SFTP_USER" ]; then
            echo "❌ Error: SFTP_HOST or SFTP_USER is empty. Set them in GitHub Repository Secrets or Variables."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "$SFTP_PORT" -H "$SFTP_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          REMOTE_DIR="${SFTP_REMOTE_DIR%/}"
          [ -z "$REMOTE_DIR" ] && REMOTE_DIR="."

          BATCH_FILE="$(mktemp)"
          trap 'rm -f "$BATCH_FILE"' EXIT
          cat > "$BATCH_FILE" <<EOF
          -mkdir ${REMOTE_DIR}
          -mkdir ${REMOTE_DIR}/assets
          -mkdir ${REMOTE_DIR}/views
          -mkdir ${REMOTE_DIR}/.well-known
          put -r dist/. ${REMOTE_DIR}/
          bye
          EOF

          SFTP_OPTS=(-P "${SFTP_PORT}" -o StrictHostKeyChecking=no -o ConnectTimeout=15)

          if [ -n "$SFTP_SSH_KEY" ]; then
            echo "$SFTP_SSH_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            sftp "${SFTP_OPTS[@]}" -i ~/.ssh/deploy_key -b "$BATCH_FILE" "${SFTP_USER}@${SFTP_HOST}"
          elif [ -n "$SFTP_PASSWORD" ]; then
            sshpass -p "$SFTP_PASSWORD" sftp "${SFTP_OPTS[@]}" -b "$BATCH_FILE" "${SFTP_USER}@${SFTP_HOST}"
          else
            echo "❌ Error: Set either SFTP_SSH_KEY or SFTP_PASSWORD in GitHub Repository Secrets."
            exit 1
          fi
